name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8b7cff&color_dots=#161b22,#2b2560,#4a3fa3,#6d5ce8,#4fd1c5
            dist/snake-light.svg?color_snake=#8b7cff&color_dots=#ebedf0,#d9d4ff,#b3a9ff,#8b7cff,#4fd1c5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
