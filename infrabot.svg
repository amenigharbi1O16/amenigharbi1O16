<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="InfraBot"><title>InfraBot</title>
<style>.ch{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-3px)}}.gl{animation:gd 9s ease-in-out infinite alternate}@keyframes gd{to{transform:translate(-40px,20px)}}</style>
<defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#4fd1c5"/></linearGradient>
<radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3b82f6" stop-opacity=".38"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".06"/></pattern>
<clipPath id="c"><rect x="1" y="1" width="598" height="298" rx="20"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="600" height="300" fill="#0b0d14"/><rect width="600" height="300" fill="url(#dots)"/><circle class="gl" cx="520" cy="40" r="230" fill="url(#g)"/>
<rect x="40" y="40" width="46" height="4" rx="2" fill="url(#lg)"/>
<text x="40" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#e9ebf5" letter-spacing="-1">InfraBot</text>
